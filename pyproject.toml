[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-power-sims"
version = "2026.11.0"
description = "Public-data simulations of batteries and power systems for space."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Allan" }]
dependencies = [
    "pybamm==25.8.0",
    # PyBaMM 25.8 does not install against NumPy 2.
    "numpy==1.26.4",
    "scipy==1.14.1",
    "matplotlib==3.10.3",
    # contourpy 1.4 wants NumPy 2, which fights the pin above.
    "contourpy==1.3.2",
    "pyyaml==6.0.2",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "ipykernel==6.29.5",
]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
