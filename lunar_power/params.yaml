# Inputs for the lunar power model.
#
# November (cold electrochemistry and the night) and December (ageing) share
# this file. Every entry has a source URL or the word ASSUMPTION. An
# assumption's note says what range was swept. CODATA constants live in
# common/constants.py, not here, because they are not scenario choices.
#
# Cell scalars are the published LG M50 parameter set as shipped in PyBaMM
# 25.8.0 (OKane2022, built on Chen2020). A test checks our copies against that
# library so a typo here fails CI. Activation energies that Chen et al. did
# not report are the ones PyBaMM's own functions use; the file comments there
# name Ecker et al. (2015) and, for the positive electrode, O'Kane et al.
# (2022) after Cabanero et al. I have not re-read those tables, and that is
# listed as a gap in the pull request.

parameters:

  # --- Published cell geometry and inventory (Chen2020 / OKane2022) ---

  electrode_height_m:
    value: 0.065
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "LG M50 unrolled-electrode height in the Chen2020 parameter set, as shipped in PyBaMM 25.8.0 OKane2022. https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/OKane2022.py"

  electrode_width_m:
    value: 1.58
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "LG M50 unrolled-electrode width in the same parameter set."

  negative_electrode_thickness_m:
    value: 8.52e-5
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Graphite electrode thickness, Chen2020 / PyBaMM OKane2022."

  separator_thickness_m:
    value: 1.2e-5
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Separator thickness, Chen2020 / PyBaMM OKane2022."

  positive_electrode_thickness_m:
    value: 7.56e-5
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "NMC electrode thickness, Chen2020 / PyBaMM OKane2022."

  negative_particle_radius_m:
    value: 5.86e-6
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Representative graphite particle radius, Chen2020 / PyBaMM OKane2022."

  positive_particle_radius_m:
    value: 5.22e-6
    unit: m
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Representative NMC particle radius, Chen2020 / PyBaMM OKane2022."

  negative_electrolyte_porosity:
    value: 0.25
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Electrolyte volume fraction in the negative electrode. In this parameter set the active-material fraction plus this porosity is 1, so binder is not given its own volume."

  separator_porosity:
    value: 0.47
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Separator porosity, Chen2020 / PyBaMM OKane2022."

  positive_electrolyte_porosity:
    value: 0.335
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Electrolyte volume fraction in the positive electrode, Chen2020 / PyBaMM OKane2022."

  negative_active_volume_fraction:
    value: 0.75
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Graphite active-material volume fraction, Chen2020 / PyBaMM OKane2022."

  positive_active_volume_fraction:
    value: 0.665
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "NMC active-material volume fraction, Chen2020 / PyBaMM OKane2022."

  bruggeman_coefficient:
    value: 1.5
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Bruggeman exponent used by this parameter set for electrolyte transport in porous media. It is an estimate of how pores reduce conductivity, not a constant we derived."

  maximum_concentration_negative_mol_m3:
    value: 33133.0
    unit: mol/m3
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Maximum lithium concentration in the graphite, Chen2020 / PyBaMM OKane2022."

  maximum_concentration_positive_mol_m3:
    value: 63104.0
    unit: mol/m3
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Maximum lithium concentration in the NMC, Chen2020 / PyBaMM OKane2022."

  initial_concentration_negative_mol_m3:
    value: 29866.0
    unit: mol/m3
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Published initial graphite concentration. It sits near a full cell (stoichiometry about 0.90) and is the start of the discharge curves."

  initial_concentration_positive_mol_m3:
    value: 17038.0
    unit: mol/m3
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Published initial NMC concentration, the pair of the graphite value above."

  electrolyte_concentration_mol_m3:
    value: 1000.0
    unit: mol/m3
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Initial electrolyte concentration. Our single-particle model holds it uniform. The Doyle-Fuller-Newman cross-check does not."

  nominal_capacity_Ah:
    value: 5.0
    unit: Ah
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "LG M50 nameplate capacity in the parameter set. C-rate is defined from this, which is the usual definition (1C empties the nameplate capacity in one hour)."

  lower_voltage_cutoff_V:
    value: 2.5
    unit: V
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Lower cut-off of the Chen2020 / OKane2022 parameter set. Discharge stops here."

  upper_voltage_cutoff_V:
    value: 4.2
    unit: V
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Upper cut-off of the parameter set. Constant-current charges stop here. This is also the usual full-cell voltage for this chemistry; it is the parameter set's limit, not a number taken from anywhere else."

  charge_transfer_coefficient:
    value: 0.5
    unit: "1"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Symmetric Butler-Volmer transfer coefficient used for intercalation in this parameter set."

  reference_temperature_K:
    value: 298.15
    unit: K
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Temperature at which the reference diffusivities and rate constants are quoted (25 C)."

  # --- Kinetics: reference values and Arrhenius energies ---

  diffusivity_reference_negative_m2_s:
    value: 3.3e-14
    unit: m2/s
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Graphite diffusivity at the reference temperature, Chen2020. Treated as independent of stoichiometry, which is what that parameterisation does."

  activation_energy_diffusion_negative_J_mol:
    value: 30300.0
    unit: J/mol
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/Chen2020.py"
    note: "Arrhenius energy in PyBaMM's graphite diffusivity function. The function comment says Chen et al. did not give it and that the value is taken from Ecker et al. (2015), https://doi.org/10.1149/2.0551509jes. I have not re-read Ecker to confirm the digit. The test checks our Arrhenius factor against PyBaMM's function."

  diffusivity_reference_positive_m2_s:
    value: 4.0e-15
    unit: m2/s
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "NMC diffusivity at the reference temperature, Chen2020."

  activation_energy_diffusion_positive_J_mol:
    value: 25000.0
    unit: J/mol
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/OKane2022.py"
    note: "Arrhenius energy in PyBaMM's NMC diffusivity function. The function comment attributes it to O'Kane et al. (2022) after Cabanero et al. (2018). I have not re-read Cabanero. The test checks our factor against PyBaMM."

  exchange_current_reference_negative:
    value: 6.48e-7
    unit: "A/m2 (m3/mol)^1.5"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "Graphite exchange-current prefactor m_ref in Chen2020, including the reference concentrations, so that j0 = m_ref * Arrhenius * sqrt(c_e * c_s * (c_max - c_s))."

  activation_energy_kinetics_negative_J_mol:
    value: 35000.0
    unit: J/mol
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/Chen2020.py"
    note: "Arrhenius energy on the graphite exchange current in PyBaMM's Chen2020 function. Checked against that function by the test."

  exchange_current_reference_positive:
    value: 3.42e-6
    unit: "A/m2 (m3/mol)^1.5"
    source: "https://doi.org/10.1149/1945-7111/ab9050"
    note: "NMC exchange-current prefactor m_ref in Chen2020."

  activation_energy_kinetics_positive_J_mol:
    value: 17800.0
    unit: J/mol
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/Chen2020.py"
    note: "Arrhenius energy on the NMC exchange current in PyBaMM's Chen2020 function."

  plating_rate_constant_m_s:
    value: 1.0e-9
    unit: m/s
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "Lithium plating kinetic rate constant in the OKane2022 parameter set. PyBaMM's irreversible plating model uses it. Our 0 V criterion does not: once the anode potential would cross 0 V vs Li/Li+, the excess current plates. The constant is recorded so the cross-check can be traced. PyBaMM's own note says these degradation parameters were fitting values, not a claim about a particular cell."

  plating_transfer_coefficient:
    value: 0.65
    unit: "1"
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "Cathodic transfer coefficient for plating in OKane2022. Used by PyBaMM's Butler-Volmer plating model, not by our 0 V criterion."

  # Nyman, Behm and Lindbergh, Electrochimica Acta 53 (2008) 6356-6365, as
  # coded in PyBaMM with an Arrhenius factor the file attributes to Ecker.
  electrolyte_conductivity_cubic_coeff:
    value: 0.1297
    unit: "S/m"
    source: "https://doi.org/10.1016/j.electacta.2008.04.023"
    note: "Coefficient of (c_e/1000 mol/L)^3 in the Nyman2008 conductivity fit used by PyBaMM. Conductivity (S/m) = a*c^3 + b*c^1.5 + d*c, with c = c_e/1000."

  electrolyte_conductivity_three_halves_coeff:
    value: -2.51
    unit: "S/m"
    source: "https://doi.org/10.1016/j.electacta.2008.04.023"
    note: "Coefficient of (c_e/1000)^1.5 in the same Nyman2008 fit."

  electrolyte_conductivity_linear_coeff:
    value: 3.329
    unit: "S/m"
    source: "https://doi.org/10.1016/j.electacta.2008.04.023"
    note: "Coefficient of (c_e/1000) in the same Nyman2008 fit."

  activation_energy_conductivity_J_mol:
    value: 17000.0
    unit: J/mol
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/OKane2022.py"
    note: "Arrhenius energy PyBaMM applies to the Nyman conductivity because Nyman et al. did not give a temperature dependence. The file comment attributes it to Ecker et al. (2015). Not re-read in Ecker. Checked against PyBaMM's function."

  # Chen2020 closed-form open-circuit potentials. OKane2022's parameter file
  # replaces the graphite one with a CSV interpolant of the same electrode.
  # We use the closed form so every coefficient is visible. The cross-check
  # uses PyBaMM's interpolant, and the small difference is part of the gap
  # between the two curves.
  ocp_negative_coefficients:
    value:
      exp_prefactor: 1.9793
      exp_slope: -39.3631
      constant: 0.2482
      tanh1_prefactor: -0.0909
      tanh1_slope: 29.8538
      tanh1_centre: 0.1234
      tanh2_prefactor: -0.04478
      tanh2_slope: 14.9159
      tanh2_centre: 0.2769
      tanh3_prefactor: -0.0205
      tanh3_slope: 30.4444
      tanh3_centre: 0.6103
    unit: V
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/Chen2020.py"
    note: "Closed-form graphite open-circuit potential versus stoichiometry from Chen et al. (2020), copied from PyBaMM's Chen2020 function. This is a fit to measured half-cell data, not the ideal Nernst equation. Paper: https://doi.org/10.1149/1945-7111/ab9050"

  ocp_positive_coefficients:
    value:
      linear_slope: -0.8090
      linear_intercept: 4.4875
      tanh1_prefactor: -0.0428
      tanh1_slope: 18.5138
      tanh1_centre: 0.5542
      tanh2_prefactor: -17.7326
      tanh2_slope: 15.7890
      tanh2_centre: 0.3117
      tanh3_prefactor: 17.5842
      tanh3_slope: 15.9308
      tanh3_centre: 0.3120
    unit: V
    source: "https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/Chen2020.py"
    note: "Closed-form NMC open-circuit potential versus stoichiometry from Chen et al. (2020). A fit to measured data, not an ideal Nernst equation."

  # --- Numerical choices for our own integrator ---

  particle_shell_count:
    value: 32
    unit: "1"
    source: ASSUMPTION
    note: "Number of finite-volume shells in each particle. Swept from 8 to 128. Eight equal shells over-filled the outer bin and plated a few milliampere-hours at 0 C on a C/2 charge; that wiggle is gone once the surface is resolved. With the grading below, 32 shells and 64 shells agree to about one percent on the plated amounts. Not a physical input."

  particle_shell_grading:
    value: 2.0
    unit: "1"
    source: ASSUMPTION
    note: "Packs radial nodes toward the particle surface. Edges follow R*(1-(1-u)^grading) with u uniform. Swept over 1 (equal shells), 1.5, 2 and 2.5. Grading 2 with 32 shells matches grading 2 with 64 shells; equal shells were still drifting at 128 nodes. A mesh choice, not a measured length."

  ode_relative_tolerance:
    value: 1.0e-4
    unit: "1"
    source: ASSUMPTION
    note: "Relative tolerance for solve_ivp. Swept only in the sense that tighter values did not move the plotted curves enough to see. A numerical setting, not a measured quantity."

  ode_absolute_tolerance:
    value: 1.0e-8
    unit: "mol/m3 or mol"
    source: ASSUMPTION
    note: "Absolute tolerance for solve_ivp. Swept only as a numerical setting, the same way as the relative tolerance: tighter values did not move the plotted curves. Not a measured quantity."

  # --- Chart A and B scenario choices ---

  plating_temperatures_C:
    value: [-20, -10, 0, 10, 25]
    unit: C
    source: ASSUMPTION
    note: "Temperatures swept for the plating chart. The set spans NASA's Ingenuity low-rate charge window of -5 C to 25 C and Perseverance's -20 C lower limit, so the chart covers the range the posts discuss. Swept across these five values; not a claim that a mission charges at all of them."

  plating_c_rates:
    value: [0.5, 1.0]
    unit: "1/h"
    source: ASSUMPTION
    note: "Two charge rates swept for chart A. 1C empties the nameplate capacity in one hour; 0.5C takes two hours. NASA does not publish Ingenuity's charge current in the battery presentation, so these are not that current. Swept over this pair."

  discharge_temperatures_C:
    value: [25, 0, -20]
    unit: C
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "25 C and 0 C are the two temperatures at which NASA quotes Ingenuity beginning-of-life pack energy (44.4 Wh and 38.8 Wh). -20 C is the lower charge and discharge limit NASA states for the Perseverance rover battery in the same presentation. The curves are our LG M50 model at those temperatures, not a reconstruction of either NASA battery."

  discharge_c_rate:
    value: 1.0
    unit: "1/h"
    source: ASSUMPTION
    note: "Discharge rate for chart B. Swept in development against 0.2C, where the energy drop from 25 C to 0 C is only a few percent and the voltage sag the post is about is hard to see. 1C is used so the sag is visible. It is not a published Ingenuity discharge rate."

  precondition_c_rate:
    value: 0.2
    unit: "1/h"
    source: ASSUMPTION
    note: "Slow discharge at 25 C used only to define a rested, nearly-empty start for the plating charges. Swept as a choice between a slow rate (close to equilibrium) and starting from the published full concentrations. 0.2C is the slow end of that choice."

  # --- Lunar night and the thermal model ---

  lunar_night_duration_h:
    value: 354.0
    unit: h
    source: "https://ntrs.nasa.gov/citations/20240004406"
    note: "NASA Glenn's hibernation abstract calls this the 354-hour lunar night. The same presentation's environment slide says about 14.75 Earth days at non-polar latitudes, and 14.75 times 24 hours is 354."

  psr_night_duration_h:
    value: 125.0
    unit: h
    source: "https://ntrs.nasa.gov/citations/20230002802"
    note: "NASA's Lunar Terrain Vehicle thermal paper: a stationary vehicle at the south pole could see an extended night of 125 hours. The same paper also mentions nights of at least 85 hours. 125 hours is the longer case used here."

  equator_predawn_temperature_K:
    value: 95.0
    unit: K
    source: "https://doi.org/10.1016/j.icarus.2016.08.012"
    note: "Williams et al., Icarus (2017), Diviner global temperatures: equatorial surface temperature falls to about 95 K just before sunrise. Used as the heat-sink temperature for the non-polar night. The same paper gives equatorial noon as about 387 to 397 K (about 114 to 124 C); that day value is context, not a night-model input."

  psr_sink_temperature_K:
    value: 50.0
    unit: K
    source: "https://ntrs.nasa.gov/citations/20230002802"
    note: "The LTV thermal paper, citing LRO, says south-pole and permanently shadowed surface temperatures can be as low as 50 K. NASA Glenn's hibernation paper uses the same 50 K figure as the cold end of the lunar night and as the temperature their cells were dwelt at. Used as the sink for the 125-hour case."

  keep_warm_setpoint_C:
    value: 0.0
    unit: C
    source: "https://ntrs.nasa.gov/citations/20230002802"
    note: "The LTV paper assumes a typical battery minimum operating temperature of 0 C or -10 C, and says the battery is usually the component that sets the heater. 0 C is the warmer, more demanding of those two published assumptions. -10 C is the other published choice and is not the curve drawn."

  radioisotope_heater_power_W:
    value: 1.0
    unit: W
    source: "https://science.nasa.gov/planetary-science/programs/radioisotope-power-systems/thermal-radioisotope-heater-units/"
    note: "NASA Science: a radioisotope heater unit outputs about one watt of heat from a plutonium-238 pellet, with no moving parts. 'About' is NASA's wording."

  conductance_min_W_per_K:
    value: 0.005
    unit: W/K
    source: ASSUMPTION
    note: "Lower end of the insulation-conductance sweep on chart C. Swept from 0.005 to 0.2 W/K. The low end is where one 1 W heater unit roughly balances the leak of a pack held at 0 C against a 95 K sink. Not a measured spacecraft conductance."

  conductance_max_W_per_K:
    value: 0.2
    unit: W/K
    source: ASSUMPTION
    note: "Upper end of the same sweep. At 0.2 W/K the hold power against a 95 K sink is a few tens of watts, which is already a heavy battery for a small lander. Swept from 0.005 to 0.2 W/K."

  chart_d_conductance_W_per_K:
    value: 0.02
    unit: W/K
    source: ASSUMPTION
    note: "One point inside the chart C sweep, used for the keep-warm versus hibernate traces. Swept as a pick inside 0.005 to 0.2 W/K so that a few-kilogram battery runs out during a 354 h night. Not a measured value."

  pack_specific_heat_J_per_kg_K:
    value: 900.0
    unit: J/(kg K)
    source: ASSUMPTION
    note: "Constant specific heat of the pack being kept warm. Swept from 700 to 1200 J/(kg K), the band in which published full-cell measurements cluster. Held constant down to the sink temperature, which overstates the thermal mass once the pack is cryogenic, because real solids lose heat capacity as they cool. The Chen2020 electrode material value of 700 J/(kg K) is a material property, not this whole-cell number, and is not what is used."

  chart_d_pack_mass_kg:
    value: 3.0
    unit: kg
    source: ASSUMPTION
    note: "Illustrative cell mass for a small lander on chart D. Swept as a choice inside 1 to 10 kg. It is not Ingenuity (0.273 kg of cells) and not the Lunar Terrain Vehicle. NASA Glenn's hibernation slides estimate 100 to 200 kg of extra battery for that vehicle's overnight heat."

  night_start_temperature_C:
    value: 20.0
    unit: C
    source: ASSUMPTION
    note: "Pack temperature at the start of the night on chart D. Swept inside 0 to 30 C. It says the pack is still near room temperature at sunset, not a measured lander."

  night_start_state_of_charge:
    value: 1.0
    unit: "1"
    source: ASSUMPTION
    note: "State of charge at sunset for chart D, swept as a choice between empty and full. NASA Glenn's freeze-thaw tests were at 0, 20 and 40 percent state of charge, not 100 percent, and their slides say higher states of charge are future work. Starting full shows the heater budget; it is not the condition they demonstrated."

  example_emissivity:
    value: 0.2
    unit: "1"
    source: ASSUMPTION
    note: "Effective emissivity used only to mark one radiative leak on chart C. Swept as an illustration inside 0.05 to 0.8, roughly a dull surface rather than a shiny one. Not a measured multi-layer-insulation value."

  example_radiating_area_m2:
    value: 0.1
    unit: m2
    source: ASSUMPTION
    note: "Effective radiating area paired with the example emissivity. Swept inside 0.02 to 0.5 m2 so the example conductance falls inside the chart C sweep. It is an illustration of Stefan-Boltzmann linearised at the 0 C setpoint, not a lander drawing."

  # --- Published numbers used only for the comparison, not as our cell ---

  ingenuity_energy_25C_Wh:
    value: 44.4
    unit: Wh
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "NASA estimated beginning-of-life energy of Ingenuity's six-cell pack at 25 C."

  ingenuity_energy_0C_Wh:
    value: 38.8
    unit: Wh
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "The same estimate at 0 C. 38.8/44.4 is about 12.6 percent less energy. Used as a direction and a relative-drop check only."

  ingenuity_cell_mass_g:
    value: 45.5
    unit: g
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "Mass of one Ingenuity cell. Six of them are 273 g. Dividing the 0 C pack energy by 0.273 kg gives the cell-level specific energy used to turn heater watt-hours into a battery mass. That division is ours; NASA does not quote the specific energy."

  ingenuity_cell_count:
    value: 6
    unit: "1"
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "Ingenuity's pack is six Sony SE US18650 VTC4 cells in series. Our simulated cell is an LG M50 parameter set, not these cells."

  ingenuity_charge_window_low_C:
    value: -5.0
    unit: C
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "NASA: operational allowable surface temperature for low-rate charge is -5 C to 25 C. Quoted as their limit for those cells. It is not an input to the plating model."

  ingenuity_charge_window_high_C:
    value: 25.0
    unit: C
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "Upper end of that low-rate charge window."

  perseverance_temperature_low_C:
    value: -20.0
    unit: C
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "Perseverance rover battery: charge and discharge permitted from -20 C to +30 C. A different battery again (EaglePicher cells). Cited to show the window depends on the cell."

  perseverance_temperature_high_C:
    value: 30.0
    unit: C
    source: "https://www.nasa.gov/wp-content/uploads/2024/01/battery-system-design-testing-and-operation-for-the-mars-perseverance-rover-and-ingenuity-helicopter.pdf"
    note: "Upper end of the Perseverance charge and discharge window in the same presentation."

  # --- December: orbit clock ---

  leo_orbit_period_min:
    value: 90.0
    unit: min
    source: "https://ntrs.nasa.gov/citations/20050192209"
    note: "NASA Glenn: an LEO orbit is approximately 90 min. The same paragraph splits it into 55 min of charge and 35 min of discharge. The 2008 status paper uses the same 90 min period: https://ntrs.nasa.gov/citations/20080008855"

  leo_sunlight_charge_min:
    value: 55.0
    unit: min
    source: "https://ntrs.nasa.gov/citations/20050192209"
    note: "Charge while the spacecraft is in sunlight. The 2008 paper charges for that same 55 min, constant current then a taper: https://ntrs.nasa.gov/citations/20080008855"

  leo_eclipse_discharge_min:
    value: 35.0
    unit: min
    source: "https://ntrs.nasa.gov/citations/20050192209"
    note: "Discharge during the eclipse portion of the same approximately 90 min orbit."

  leo_depth_of_discharge:
    value: 0.40
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20080008855"
    note: "40 percent depth of discharge. The 2008 paper calls this the outer envelope they chose for LEO lithium-ion testing. Their batteries were about 25 Ah; the fraction is what is reused here, not their ampere-hours."

  leo_cycle_goal:
    value: 30000.0
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20050192209"
    note: "NASA's stated goal for that LEO test: demonstrate 5 years of life, or 30,000 cycles. 30,000 divided by 16 cycles a day is 1,875 days, which is a bit over five calendar years. The paper treats the two as the same goal."

  leo_cycles_reported:
    value: 12000.0
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20080008855"
    note: "By the 2008 paper each battery had accumulated over 12,000 cycles and was still above the failure voltage. The chart marks 12,000. It does not mark a higher completed total the paper does not give."

  nonpolar_day_to_night_ratio:
    value: 1.0
    unit: "1"
    source: ASSUMPTION
    note: "Swept from 0.8 to 1.2. The drawn lunar-day cadence uses 1, so the sunlit hours equal the 354 hour night already in this file. That doubling is not a second measurement. Polar nights are a different length."

  mars_sol_hours:
    value: 24.0
    unit: h
    source: "https://www.giss.nasa.gov/tools/mars24/help/notes.html"
    note: "NASA GISS Mars24: a mean Mars solar day is 24 hours 39 minutes 35.244 seconds. The three parts are split so the code adds them."

  mars_sol_minutes:
    value: 39.0
    unit: min
    source: "https://www.giss.nasa.gov/tools/mars24/help/notes.html"
    note: "Minutes part of the same mean sol."

  mars_sol_seconds:
    value: 35.244
    unit: s
    source: "https://www.giss.nasa.gov/tools/mars24/help/notes.html"
    note: "Seconds part of the same mean sol, including the 0.244 s."

  # --- December: the surface film (PyBaMM OKane2022 fitting values) ---

  sei_initial_thickness_m:
    value: 5.0e-9
    unit: m
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "Initial SEI thickness in the OKane2022 parameter set shipped with PyBaMM 25.8.0. PyBaMM's file says these degradation values were used to fit models and are not claimed as the true values of a particular cell. https://github.com/pybamm-team/PyBaMM/blob/v25.8.0/src/pybamm/input/parameters/lithium_ion/OKane2022.py"

  sei_solvent_diffusivity_m2_s:
    value: 2.5e-22
    unit: m2/s
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "SEI solvent diffusivity in that same parameter set. O'Kane et al. identify this as the parameter that sets diffusion-limited film growth. The original table behind the digit was not re-read; a test locks it to the installed PyBaMM object."

  sei_bulk_solvent_concentration_mol_m3:
    value: 2636.0
    unit: mol/m3
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "Bulk solvent concentration used by PyBaMM's solvent-diffusion-limited SEI option (phase parameter c_sol)."

  sei_partial_molar_volume_m3_mol:
    value: 9.585e-5
    unit: m3/mol
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "SEI partial molar volume in the OKane2022 set. Converts a lithium flux into a thickness."

  sei_lithium_per_mole:
    value: 1.0
    unit: "1"
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "PyBaMM name: Ratio of lithium moles to SEI moles. It is 1 in this set. Ploehn, Ramadass and White describe a two-electron reduction; this file does not replace the 1 with a 2, because the cross-check would then be a different equation. https://doi.org/10.1149/1.1644601"

  sei_resistivity_ohm_m:
    value: 200000.0
    unit: ohm m
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "SEI resistivity in the OKane2022 set. Film resistance added to the cold model is this times the grown thickness, divided by the graphite surface area."

  sei_growth_activation_energy_J_mol:
    value: 38000.0
    unit: J/mol
    source: "https://doi.org/10.1039/D2CP00417H"
    note: "SEI growth activation energy in the OKane2022 set. The Arrhenius factor multiplies solvent diffusivity. Checked against PyBaMM's parameter object, not re-derived from a separate table."

  # --- December: depth of discharge and cracking ---

  fade_dod_shallow:
    value: 0.20
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20050185205"
    note: "20% is one of the depths in NASA's LEO verification matrix (20, 30, 35 and 40%). Used as the shallow curve. The fade on that curve is this model, not a digitised result from that test."

  fade_dod_leo:
    value: 0.40
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20080008855"
    note: "The 40% LEO depth, repeated so the fade chart and the orbit chart name the same fraction."

  fade_dod_rover_early:
    value: 0.60
    unit: "1"
    source: "https://ntrs.nasa.gov/citations/20080015793"
    note: "The 2004 MER battery workshop slides say depth of discharge is typically 60-70% through sol 54. 60% is the lower end of that stated range, not an average invented between the two ends. It is early-mission telemetry, not a measured depth for all 5,111 sols."

  graphite_full_lithiation_volume_change:
    value: 0.132
    unit: "1"
    source: "https://doi.org/10.1021/acs.jpcc.8b01873"
    note: "Schweidler et al., J. Phys. Chem. C (2018): total graphite volume expansion of 13.2% from C6 to LiC6. Crystal volume, not the thickness change of this cell's electrode."

  crack_area_fraction_at_full_expansion:
    value: 0.02
    unit: "1"
    source: ASSUMPTION
    note: "Fraction of the graphite surface that grows a new skin each cycle at full lithiation. Swept from 0.002 to 0.05. The drawn curves use 0.02, inside that sweep. Not a measured crack area. The low end of the sweep is where cracking barely adds to diffusion-limited growth."

  crack_area_fraction_sweep_low:
    value: 0.002
    unit: "1"
    source: ASSUMPTION
    note: "Lower end of the crack-fraction sweep. Swept from 0.002 to 0.05. The band on the 40% fade curve runs from this value to the upper end."

  crack_area_fraction_sweep_high:
    value: 0.05
    unit: "1"
    source: ASSUMPTION
    note: "Upper end of the same sweep. Swept from 0.002 to 0.05."

  rover_cycles_per_sol:
    value: 1.0
    unit: 1/sol
    source: ASSUMPTION
    note: "Swept from 0.5 to 1.5 cycles per sol. The dashed curve uses 1. The 2004 workshop slides show a charge and a discharge against sol number through sol 54, which is the early-mission pattern this 1 is taken from. It is not a counted total over 5,111 sols."

  feed_age_years:
    value: 1.0
    unit: yr
    source: ASSUMPTION
    note: "Age at which the ageing layer updates the cold model's inventory and resistance. Swept from 0.25 to 5 years. The duty is the 40% LEO cycle at 16 cycles a day. Zero would leave the November cell unchanged; 1 year is inside the sweep."

  # --- December: radiation, label only ---

  radiation_diffusivity_multipliers:
    value: [1.0, 2.0, 5.0]
    unit: "1"
    source: ASSUMPTION
    note: "Swept across 1, 2 and 5. If radiation were forced into the model as a multiplier on solvent diffusivity, these are the factors that were tried. They are drawn on the concept chart and are not applied to the fade curves or to the cold-model feed."

  radiation_paper_upper_dose_Mrad:
    value: 25.0
    unit: Mrad
    source: "https://doi.org/10.1149/1.1666128"
    note: "Ratnakumar et al., J. Electrochem. Soc. 151 (2004) A652. Cumulative dose the cells were taken to. The abstract says only a marginal capacity decline, and that the study had no unirradiated control. Not an input to the fade rate."

  radiation_paper_mission_dose_Mrad:
    value: 4.0
    unit: Mrad
    source: "https://doi.org/10.1149/1.1666128"
    note: "The same abstract's 'about 4 Mrad' of gamma radiation for missions to Jupiter and its moons. Context on the concept chart only."

  # --- December: Opportunity, the case, not a fitted cell ---

  opportunity_design_life_sols:
    value: 90.0
    unit: sol
    source: "https://www.nasa.gov/news-release/nasas-record-setting-opportunity-rover-mission-on-mars-comes-to-end/"
    note: "NASA: designed to last just 90 Martian days. The same release says the rover exceeded that life by 60 times and that the mission was almost 15 years. 60 times 90 sols is 5,400 sols, which is not the sol number of the last contact. Both wordings are NASA's. The chart marks 90 sols and sol 5111, not 5,400."

  opportunity_last_contact_sol:
    value: 5111.0
    unit: sol
    source: "https://ntrs.nasa.gov/citations/20200000214"
    note: "Opportunity end-of-mission report: last communication on sol 5111 (10 June 2018), after more than fourteen years. The NASA release of 13 February 2019 says almost 15 years."

  opportunity_life_multiple:
    value: 60.0
    unit: "1"
    source: "https://www.nasa.gov/news-release/nasas-record-setting-opportunity-rover-mission-on-mars-comes-to-end/"
    note: "NASA: exceeding its life expectancy by 60 times. Quoted beside the 90 sol design life. Not used as a cycle count."
