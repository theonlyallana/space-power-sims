name: CI

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pinned stack
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        env:
          PYBAMM_DISABLE_TELEMETRY: "1"
        run: pytest
      - name: Smoke-run the November scripts
        env:
          PYBAMM_DISABLE_TELEMETRY: "1"
          SPACE_POWER_SIMS_MODE: smoke
        run: python 01-lunar-night-battery/run_all.py --smoke
